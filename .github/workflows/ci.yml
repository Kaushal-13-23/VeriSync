name: VeriSync CI

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages and apps
        run: pnpm build

      - name: Run security dependency audit (NFR-SEC-011)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Scan repository for secrets and credentials (NFR-SEC-005, Rule 5)
        run: |
          echo "Scanning for hardcoded secrets, private keys, and passwords..."
          ! git grep -nEI "(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z\\-_]{35}|ghp_[0-9a-zA-Z]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" -- ':!.env.example' ':!*test*' ':!*.spec.*'
