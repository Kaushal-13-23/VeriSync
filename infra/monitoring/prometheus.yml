global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: 'verisync-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['prod-api:4000', 'host.docker.internal:4000']
        labels:
          service: 'api'
          environment: 'production'
