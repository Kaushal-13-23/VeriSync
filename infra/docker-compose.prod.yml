version: '3.8'

services:
  prod-db:
    image: postgres:16-alpine
    container_name: verisync-prod-db
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: verisync_prod
    secrets:
      - db_user
      - db_password
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./backup/wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verisync_admin -d verisync_prod']
      interval: 10s
      timeout: 5s
      retries: 5

  prod-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: verisync-prod-api
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    depends_on:
      prod-db:
        condition: service_healthy
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://verisync_admin:REPLACE_WITH_SECRET@prod-db:5432/verisync_prod?schema=public&connection_limit=60&pool_timeout=5
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:4000/api/v1/health/live || exit 1']
      interval: 15s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: verisync-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - '9090:9090'

volumes:
  prod_pgdata:
  prometheus_data:

secrets:
  db_user:
    external: true
  db_password:
    external: true
  jwt_access_secret:
    external: true
  jwt_refresh_secret:
    external: true
