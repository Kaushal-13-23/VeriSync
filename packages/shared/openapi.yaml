openapi: 3.0.3
info:
  title: VeriSync Placement Assessment Platform API
  version: 1.1.0
  description: >
    Official OpenAPI contract for VeriSync secure placement-assessment platform.
    Source of truth: docs/SRS/srs.md.
    Changes must be proposed via Developer A (Kaushal Kumar Singh) in packages/shared/openapi.yaml.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development environment

paths:
  /health:
    get:
      summary: System Health Check
      description: Returns server operational status and authoritative UTC timestamp (Rule 9, FR-TIME-001).
      operationId: getHealthStatus
      responses:
        '200':
          description: Server is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'

  /auth/login:
    post:
      summary: Candidate & Administrator Authentication
      description: >
        Authenticates credentials against Argon2id hashed passwords.
        Candidates may authenticate using either Candidate ID (e.g. CAN-2026-081) or Username (Decision 3, FR-AUTH-002).
        Admins with MFA enabled receive an MFA challenge token (FR-AUTH-008).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful (returns JWT tokens or MFA challenge).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limited due to repeated failed attempts (TC17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/mfa/verify:
    post:
      summary: Verify Administrator MFA Code
      description: Verifies 6-digit RFC 6238 TOTP code using MFA challenge token (FR-AUTH-008).
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
      responses:
        '200':
          description: MFA verification successful; returns access and refresh tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          description: Invalid or expired MFA verification code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh Access Token
      description: Rotates refresh token and issues a new access token pair (FR-AUTH-007).
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated and new access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          description: Refresh token invalid or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/logout:
    post:
      summary: End User Session
      description: Revokes user refresh token and terminates session server-side (FR-AUTH-006, FR-AUTH-007).
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /admin/candidates/{id}/password-reset:
    post:
      summary: Admin Candidate Password Reset
      description: SuperAdmin initiated password reset without exposing old password (FR-AUTH-005, Rule 7).
      operationId: adminResetPassword
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Candidate ID or User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordResetRequest'
      responses:
        '200':
          description: Password reset successfully and active sessions revoked.
        '403':
          description: Insufficient privileges (Requires SuperAdmin).

  /admin/candidates/{id}/deactivate:
    patch:
      summary: Deactivate Candidate Account
      description: SuperAdmin initiated deactivation; revokes all candidate sessions immediately (FR-AUTH-006, Rule 7).
      operationId: deactivateAccount
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateAccountRequest'
      responses:
        '200':
          description: Account deactivated and sessions terminated.
        '403':
          description: Insufficient privileges.

  /admin/audit-logs:
    get:
      summary: Search Audit Logs
      description: Authoritative audit trail inspection for SuperAdmin and Technical Evaluator (FR-AUD-001, FR-ADMIN-001).
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: actorUserId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: correlationId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of matching audit log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatusResponse:
      type: object
      required:
        - status
        - serverTime
        - version
      properties:
        status:
          type: string
          enum: [ok, degraded]
        serverTime:
          type: string
          format: date-time
          example: '2026-10-25T14:30:00Z'
        version:
          type: string
          example: '1.1.0'

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Candidate ID (e.g. CAN-2026-001) or Username (Decision 3).
          example: 'CAN-2026-001'
        password:
          type: string
          format: password
          example: 'Secret123!'

    LoginResponse:
      type: object
      required:
        - mfaRequired
      properties:
        mfaRequired:
          type: boolean
        mfaToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum: [SUPER_ADMIN, CANDIDATE, TECHNICAL_EVALUATOR]
            candidateProfile:
              type: object

    VerifyMfaRequest:
      type: object
      required:
        - mfaToken
        - code
      properties:
        mfaToken:
          type: string
        code:
          type: string
          example: '123456'

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    TokenPairResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AdminPasswordResetRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8

    DeactivateAccountRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: 'Suspicious exam behavior / violation of policy'

    AuditLogEntry:
      type: object
      required:
        - id
        - eventType
        - affectedEntity
        - eventTimestamp
        - outcome
        - correlationId
      properties:
        id:
          type: string
        actorUserId:
          type: string
          nullable: true
        eventType:
          type: string
        affectedEntity:
          type: string
        eventTimestamp:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [SUCCESS, DENIED, FAILURE]
        correlationId:
          type: string
        metadata:
          type: object

    ApiErrorCode:
      type: string
      description: Standard API Error Codes per SRS Section 8.3.3.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_ELIGIBLE
        - INVALID_STATE
        - QUESTION_EXPIRED
        - DUPLICATE_REQUEST
        - UNSUPPORTED_CLIENT
        - RATE_LIMITED
        - VALIDATION_FAILED
        - INTERNAL_ERROR

    ApiErrorResponse:
      type: object
      required:
        - status
        - code
        - message
        - correlationId
      properties:
        status:
          type: string
          enum: [rejected, error]
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          example: 'Invalid username/candidate ID or password'
        correlationId:
          type: string
          example: 'c-7d21f8'
        details:
          type: object
