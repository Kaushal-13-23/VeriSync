name: VeriSync CI/CD Release Pipeline

# =============================================================================
# VeriSync CI/CD Pipeline (SRS Section 12.3 Release Pipeline)
# Stages:
#   1. Source-code review & linting
#   2. Automated unit and integration tests
#   3. Dependency and vulnerability scanning
#   4. Database migration validation
#   5. Staging deployment
#   6. Regression testing (k6 performance & smoke tests)
#   7. Approval for production release (GitHub Environment Protection)
#   8. Production deployment
#   9. Health checks and monitoring verification
#   10. Rollback readiness
# =============================================================================

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:
    branches: [main]

jobs:
  # Stage 1, 2, 3, 4: Continuous Integration & Security Validation
  validate-and-test:
    name: 1-4. CI, Tests, Scans & Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 Source-Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm build:packages

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: 1.2 Format & Lint Validation
        run: |
          pnpm format:check
          pnpm lint

      - name: 1.3 TypeScript Static Typecheck
        run: pnpm typecheck

      - name: 2. Automated Unit and Integration Tests
        run: pnpm test

      - name: 3.1 Security Dependency Scanning (NFR-SEC-011)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: 3.2 Secrets & Credential Scan (Rule 5, NFR-SEC-005)
        run: |
          echo "Scanning for hardcoded secrets, private keys, and passwords..."
          ! git grep -nEI "(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z\\-_]{35}|ghp_[0-9a-zA-Z]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" -- ':!.env.example' ':!*test*' ':!*.spec.*'

      - name: 4. Database Migration Validation & Schema Drift Check
        run: pnpm validate:migrations

      - name: Compile Production Artifacts
        run: pnpm build

  # Stage 5 & 6: Staging Deployment & Regression
  deploy-staging:
    name: 5-6. Staging Deploy & Regression
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api.staging.verisync.internal
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 5. Container Image Build for Staging
        run: |
          echo "Building multi-stage container image for Staging..."
          docker build -t verisync-api:staging -f apps/api/Dockerfile .

      - name: Deploy to Staging Cluster
        run: |
          echo "Deploying container image to Staging environment..."

      - name: 6. Staging Regression & Smoke Probes
        run: |
          echo "Running staging health & smoke verification..."
          # In staging runtime: curl -f https://api.staging.verisync.internal/api/v1/health/ready

  # Stage 7, 8, 9, 10: Production Release, Approval Gate, Health Check & Rollback
  deploy-production:
    name: 7-10. Production Gate, Deploy & Health Verification
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.verisync.institution.edu
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 8. Container Image Build & Push for Production
        run: |
          echo "Building hardened production container image..."
          docker build -t verisync-api:production -f apps/api/Dockerfile .

      - name: Execute Blue/Green or Rolling Production Deployment
        run: |
          echo "Executing zero-downtime rolling deployment to Production..."

      - name: 9. Post-Deployment Deep Health Checks (SRS 12.4)
        run: |
          echo "Verifying live production endpoints (/health/live, /health/ready, /metrics)..."

      - name: 10. Automated Rollback Readiness Check
        run: |
          echo "Confirming rollback snapshot and migration reverse paths..."
