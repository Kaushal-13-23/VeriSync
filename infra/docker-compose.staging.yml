version: '3.8'

services:
  staging-db:
    image: postgres:16-alpine
    container_name: verisync-staging-db
    environment:
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_secure_password_replace_in_secrets_manager
      POSTGRES_DB: verisync_staging
    ports:
      - '5433:5432'
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U staging_user -d verisync_staging']
      interval: 5s
      timeout: 5s
      retries: 5

  staging-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: verisync-staging-api
    restart: on-failure
    depends_on:
      staging-db:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      API_PORT: 4000
      DATABASE_URL: postgresql://staging_user:staging_secure_password_replace_in_secrets_manager@staging-db:5432/verisync_staging?schema=public&connection_limit=30
      JWT_ACCESS_SECRET: staging_jwt_secret_should_be_loaded_from_vault_min_32_chars
      JWT_REFRESH_SECRET: staging_jwt_refresh_secret_should_be_loaded_from_vault
    ports:
      - '4001:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:4000/api/v1/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  staging_pgdata:
